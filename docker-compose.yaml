services:
  backend:
    build: ./backend
    container_name: gridbricks-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: always

  frontend:
    build: ./frontend
    container_name: gridbricks-frontend
    ports:
      - "1573:1573"
    depends_on:
      - backend
    restart: always